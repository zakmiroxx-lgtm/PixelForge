name: Build PixelForge Windows

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build PixelForge EXE
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    steps:

      # ========================================
      # STEP 1: Download repository
      # ========================================

      - name: Download Source Code
        uses: actions/checkout@v4

      # ========================================
      # STEP 2: Setup Python
      # ========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ========================================
      # STEP 3: Extract ZIP using Python
      # ========================================

      - name: Extract PixelForge ZIP
        run: |
          @'
          import zipfile
          import pathlib
          import shutil
          import sys

          root = pathlib.Path.cwd()

          print("Searching for ZIP archive...")

          archives = sorted(root.glob("*.zip"))

          if not archives:
              print("ERROR: No ZIP archive found!")
              sys.exit(1)

          archive = archives[0]

          print(f"Found ZIP: {archive.name}")

          extract_dir = root / "_extracted"

          extract_dir.mkdir(exist_ok=True)

          print("Extracting archive...")

          try:
              with zipfile.ZipFile(archive, "r") as z:
                  bad_file = z.testzip()

                  if bad_file:
                      raise RuntimeError(
                          f"Corrupted ZIP member: {bad_file}"
                      )

                  for member in z.infolist():
                      destination = (
                          extract_dir / member.filename
                      ).resolve()

                      if not destination.is_relative_to(
                          extract_dir.resolve()
                      ):
                          raise RuntimeError(
                              "Unsafe ZIP path detected"
                          )

                  z.extractall(extract_dir)

          except Exception as error:
              print(f"Extraction failed: {error}")
              sys.exit(1)

          print("ZIP extracted successfully!")

          print("Searching for CMakeLists.txt...")

          cmake_files = list(
              extract_dir.rglob("CMakeLists.txt")
          )

          if not cmake_files:
              print("ERROR: CMakeLists.txt not found!")
              sys.exit(1)

          project_dir = None

          for cmake_file in cmake_files:
              candidate = cmake_file.parent

              if (candidate / "src").is_dir():
                  project_dir = candidate
                  break

          if project_dir is None:
              print(
                  "ERROR: Cannot find project root "
                  "containing CMakeLists.txt and src/"
              )
              sys.exit(1)

          print(f"Project root: {project_dir}")

          print("Copying project files...")

          for item in project_dir.iterdir():

              destination = root / item.name

              if destination.exists():
                  print(
                      f"Skipping existing item: {item.name}"
                  )
                  continue

              if item.is_dir():
                  shutil.copytree(item, destination)
              else:
                  shutil.copy2(item, destination)

          print("Project files ready!")

          print("Root directory contents:")

          for item in root.iterdir():
              print(" -", item.name)

          '@ | Set-Content -Path extract_project.py -Encoding utf8

          python extract_project.py

          if ($LASTEXITCODE -ne 0) {
            throw "ZIP extraction failed!"
          }

      # ========================================
      # STEP 4: Verify project files
      # ========================================

      - name: Verify PixelForge Structure
        run: |
          Write-Host "Checking required project files..."

          $required = @(
            "CMakeLists.txt",
            "src/main.cpp",
            "src/core/Layer.h",
            "src/core/Layer.cpp",
            "src/core/Document.h",
            "src/core/Document.cpp",
            "src/canvas/Canvas.h",
            "src/canvas/Canvas.cpp",
            "src/ui/MainWindow.h",
            "src/ui/MainWindow.cpp",
            "tests/DocumentTests.cpp"
          )

          $missing = @()

          foreach ($file in $required) {

            if (Test-Path $file) {
              Write-Host "OK: $file"
            }
            else {
              Write-Host "MISSING: $file"
              $missing += $file
            }

          }

          if ($missing.Count -gt 0) {
            throw "Missing required files: $($missing -join ', ')"
          }

          Write-Host "Project structure verified!"

      # ========================================
      # STEP 5: Setup MSVC
      # ========================================

      - name: Setup Visual Studio Compiler
        uses: ilammy/msvc-dev-cmd@v1

      # ========================================
      # STEP 6: Install Qt
      # ========================================

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      # ========================================
      # STEP 7: Configure CMake
      # ========================================

      - name: Configure CMake
        run: |
          Write-Host "Configuring PixelForge..."

          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed!"
          }

          Write-Host "CMake configured successfully!"

      # ========================================
      # STEP 8: Build application
      # ========================================

      - name: Build PixelForge
        run: |
          Write-Host "Building PixelForge..."

          cmake --build build `
            --config Release `
            --parallel 2

          if ($LASTEXITCODE -ne 0) {
            throw "PixelForge compilation failed!"
          }

          Write-Host "Build successful!"

      # ========================================
      # STEP 9: Run tests
      # ========================================

      - name: Run Tests
        run: |
          Write-Host "Running PixelForge tests..."

          ctest --test-dir build `
            -C Release `
            --output-on-failure

          if ($LASTEXITCODE -ne 0) {
            throw "Tests failed!"
          }

          Write-Host "All tests passed!"

      # ========================================
      # STEP 10: Deploy Qt libraries
      # ========================================

      - name: Deploy Qt Libraries
        run: |
          Write-Host "Preparing portable application..."

          $exe = "build/Release/PixelForge.exe"

          if (-not (Test-Path $exe)) {
            throw "PixelForge.exe not found!"
          }

          $deploy = Join-Path $env:QT_ROOT_DIR "bin/windeployqt.exe"

          & $deploy --release $exe

          if ($LASTEXITCODE -ne 0) {
            throw "Qt deployment failed!"
          }

          Write-Host "Qt libraries deployed!"

      # ========================================
      # STEP 11: Package application
      # ========================================

      - name: Create Windows ZIP
        run: |
          Write-Host "Creating distribution archive..."

          $source = "build/Release"

          $destination = "PixelForge-Windows.zip"

          if (Test-Path $destination) {
            Remove-Item $destination -Force
          }

          Compress-Archive `
            -Path "$source/*" `
            -DestinationPath $destination `
            -Force

          if (-not (Test-Path $destination)) {
            throw "ZIP creation failed!"
          }

          Write-Host "Package created successfully!"

      # ========================================
      # STEP 12: Upload application
      # ========================================

      - name: Upload PixelForge
        uses: actions/upload-artifact@v4
        with:
          name: PixelForge-Windows
          path: PixelForge-Windows.zip
          if-no-files-found: error
          retention-days: 30
